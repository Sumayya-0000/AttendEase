{% extends 'base.html' %}{% block content %}<section class="card"><h2>Add a student</h2><form method="post"><div class="grid"><div><label for="name">Full name</label><input id="name" name="name" required></div><div><label for="roll_number">Roll number</label><input id="roll_number" name="roll_number" required></div><div><label for="course">Course / class</label><input id="course" name="course" value="Information Technology"></div></div><p><button type="submit">Add student</button></p></form></section><section class="card"><h2>Students ({{ students|length }})</h2><div class="table-wrap"><table><thead><tr><th>Roll number</th><th>Name</th><th>Course</th><th>Action</th></tr></thead><tbody>{% for s in students %}<tr><td>{{ s.roll_number }}</td><td>{{ s.name }}</td><td>{{ s.course }}</td><td><form method="post" action="{{ url_for('delete_student', student_id=s.id) }}" onsubmit="return confirm('Remove this student and their attendance records?')"><button class="danger">Remove</button></form></td></tr>{% else %}<tr><td colspan="4">No students yet.</td></tr>{% endfor %}</tbody></table></div></section>{% endblock %}
