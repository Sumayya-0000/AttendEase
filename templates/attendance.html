{% extends 'base.html' %}{% block content %}<section class="card"><h2>Mark attendance</h2><form method="get"><label for="date">Attendance date</label><input id="date" name="date" type="date" value="{{ chosen_date }}"><p><button>Load date</button></p></form></section><section class="card"><form method="post"><input type="hidden" name="date" value="{{ chosen_date }}"><div class="table-wrap"><table><thead><tr><th>Roll number</th><th>Student</th><th>Course</th><th>Status</th></tr></thead><tbody>{% for s in students %}<tr><td>{{ s.roll_number }}</td><td>{{ s.name }}</td><td>{{ s.course }}</td><td><select name="status_{{ s.id }}"><option value="Present" {% if s.status == 'Present' %}selected{% endif %}>Present</option><option value="Late" {% if s.status == 'Late' %}selected{% endif %}>Late</option><option value="Absent" {% if s.status == 'Absent' or not s.status %}selected{% endif %}>Absent</option></select></td></tr>{% endfor %}</tbody></table></div><p><button type="submit">Save attendance</button></p></form></section>{% endblock %}
