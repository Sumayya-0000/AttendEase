<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Attendance Tracker</title><style>
:root{--ink:#172033;--muted:#64748b;--primary:#2457d6;--bg:#f3f6fc;--card:#fff;--line:#e5eaf3}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}header{background:linear-gradient(120deg,#173b91,#3678e8);color:white;padding:22px max(20px,calc((100% - 1100px)/2));}header h1{margin:0 0 14px;font-size:25px}nav{display:flex;gap:10px;flex-wrap:wrap}nav a{color:white;text-decoration:none;padding:8px 12px;border-radius:9px;background:#ffffff20}main{max-width:1100px;margin:28px auto;padding:0 18px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 5px 20px #17203308}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}.stat strong{display:block;font-size:30px;margin-top:8px}.muted{color:var(--muted)}label{display:block;font-weight:600;margin:10px 0 5px}input,select{padding:10px;border:1px solid #ccd5e5;border-radius:8px;max-width:100%;width:100%}button,.button{display:inline-block;background:var(--primary);color:#fff;border:0;border-radius:9px;padding:10px 14px;text-decoration:none;cursor:pointer;font-weight:600}button.danger{background:#b42335}table{border-collapse:collapse;width:100%;background:white}th,td{padding:11px;border-bottom:1px solid var(--line);text-align:left}th{background:#f8faff}.table-wrap{overflow-x:auto}.flash{padding:12px;border-radius:9px;margin-bottom:12px;background:#e7f8ed}.flash.error{background:#ffebee}.status-Present{background:#dcfce7}.status-Late{background:#fef3c7}.status-Absent{background:#fee2e2}.pill{padding:5px 8px;border-radius:7px;font-size:13px}@media(max-width:600px){main{margin-top:16px}.card{padding:14px}header h1{font-size:21px}}
</style></head><body><header><h1>📘 Attendance Tracker</h1><nav><a href="{{ url_for('dashboard') }}">Dashboard</a><a href="{{ url_for('attendance') }}">Mark Attendance</a><a href="{{ url_for('students_page') }}">Students</a><a href="{{ url_for('report') }}">Reports</a></nav></header><main>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
